#:schema https://yazi-rs.github.io/schemas/yazi.json

[opener]
edit = [
	{ run = "nvim %s", desc = "Neovim", for = "unix", block = true },
]
inspect = [
	{ run = "file -- %s; printf '\nPress Enter to return'; read -r _", desc = "File information", for = "unix", block = true },
]

[open]
rules = [
	{ url = "*/", use = "edit" },
	{ mime = "text/*", use = [ "edit", "inspect" ] },
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "inspect" ] },
	{ mime = "inode/empty", use = [ "edit", "inspect" ] },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "inspect" ] },
	{ url = "*", use = "inspect" },
]
